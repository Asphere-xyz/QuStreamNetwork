enum RequestStatus {
  Pending
  Success
  Fail
}

type QuStreamRequest @entity {
  id: ID!
  requestId: BigInt! @index
  sender: String! @index
  userID: String!
  qBlock: String!
  status: RequestStatus!
  createdAtBlock: Int! @index
  createdAtTimestamp: DateTime!
  processedAtBlock: Int
  processedAtTimestamp: DateTime
}

type QuStreamStats @entity {
  id: ID!
  totalRequests: Int!
  totalSuccessful: Int!
  totalFailed: Int!
  totalPending: Int!
  lastUpdatedBlock: Int! @index
}
