name: Test QuStream Indexer

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=8192 --no-deprecation"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  SCCACHE_CACHE_SIZE: "10GB"
  SCCACHE_GHA_ENABLED: true

jobs:
  test-indexer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "qustream-indexer/.nvmrc"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3

      - name: Cache zombienet binaries
        uses: actions/cache@v4
        with:
          path: zombienet/bin
          key: ${{ runner.os }}-zombienet-v1.3.133-polkadot-stable2506-1-binfix2
          restore-keys: |
            ${{ runner.os }}-zombienet-

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Rust toolchain
        run: |
          if ! which "rustup" > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          rustup override unset
          rustup show
          rustup target add wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        id: cache-rust-build
        with:
          # Cache Rust build artifacts (target/) to speed up builds
          # This caches compiled dependencies and intermediate artifacts
          # Cache key includes Cargo.lock hash so it invalidates when dependencies change
          path: |
            target/
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Setup Docker database (background)
        working-directory: qustream-indexer
        run: docker compose up -d db

      - name: Install contract dependencies
        working-directory: qustream-smart-contracts
        run: npm install

      - name: Install indexer dependencies
        working-directory: qustream-indexer
        run: npm install && npm run build

      - name: Wait for database
        timeout-minutes: 2
        run: timeout 60 bash -c 'until docker exec $(docker ps -qf "name=db") pg_isready -U postgres; do sleep 5; done'

      - name: Install expect for interactive prompts
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Setup contract deployment keys
        run: |
          echo "PRIVATE_KEY=0x8075991ce870b93a8870eca0c0f91913d12f47948ca0fd25b49c6fa7cdbeee8b" >> $GITHUB_ENV

      - name: Create contract parameters file
        working-directory: qustream-smart-contracts
        run: |
          cat > ignition/modules/QuStreamRequestManager.parameters.json <<EOF
          {
            "QuStreamRequestManagerModule": {
              "CONTRACT_OWNER": "0xf24FF3a9CF04c71Dbc94D0b566f7A27B94566cac",
              "MASTER_NODE": "0x773539d4Ac0e786233D90A233654ccEE26a613D9"
            }
          }
          EOF

      - name: Build node binary and setup zombienet
        timeout-minutes: 60
        run: |
          echo "Downloading zombienet binaries..."
          make download-binaries

          echo "Verifying downloaded binaries..."
          ls -lh zombienet/bin/ || echo "WARNING: zombienet/bin directory not found"
          for bin in zombienet polkadot polkadot-execute-worker polkadot-prepare-worker substrate-relay; do
            if [ -f "zombienet/bin/$bin" ]; then
              echo "✓ Found $bin"
              chmod +x "zombienet/bin/$bin" || true
            else
              echo "WARNING: $bin not found in zombienet/bin/"
            fi
          done

          echo "Validating polkadot binaries are ELF (not HTML)..."
          NEED_REDOWNLOAD=0
          for bin in polkadot polkadot-execute-worker polkadot-prepare-worker; do
            if [ -f "zombienet/bin/$bin" ]; then
              if ! file "zombienet/bin/$bin" | grep -q "ELF"; then
                echo "Corrupted $bin detected (non-ELF); removing to force re-download"
                rm -f "zombienet/bin/$bin"
                NEED_REDOWNLOAD=1
              fi
            else
              NEED_REDOWNLOAD=1
            fi
          done

          if [ "$NEED_REDOWNLOAD" -eq 1 ]; then
            echo "Re-downloading polkadot binaries..."
            make download-binaries
          fi

          echo "Post-validation of polkadot binaries:"
          for bin in polkadot polkadot-execute-worker polkadot-prepare-worker; do
            if [ -f "zombienet/bin/$bin" ]; then
              file "zombienet/bin/$bin" || true
            else
              echo "WARNING: $bin still missing after re-download"
            fi
          done

          echo "Checking Rust build cache status..."
          CACHE_HIT="${{ steps.cache-rust-build.outputs.cache-hit }}"
          if [ "$CACHE_HIT" == "true" ]; then
            echo "✓ Rust build artifacts restored from cache (dependencies already compiled)"
            if [ -f "target/release/qustream" ]; then
              echo "✓ Node binary found in cache - build may be very fast or skipped"
              ls -lh target/release/qustream
            else
              echo "Building node binary (using cached dependencies - should be faster)..."
              make release-build
            fi
          else
            echo "Building node binary (first run - this takes 30-45 minutes)..."
            echo "Cache miss - will cache build artifacts after build completes"
            make release-build
          fi

          echo "Verifying node binary..."
          if [ ! -f "target/release/qustream" ]; then
            echo "ERROR: Node binary not found at target/release/qustream"
            exit 1
          fi

          if [ ! -x "target/release/qustream" ]; then
            echo "Making node binary executable..."
            chmod +x target/release/qustream
          fi

          echo "Verifying symlink..."
          if [ ! -e "zombienet/bin/qustream" ]; then
            echo "Creating symlink..."
            mkdir -p zombienet/bin
            ln -sf "../../target/release/qustream" zombienet/bin/qustream
          fi

          echo "✓ All binaries ready"
          echo "Binary locations:"
          ls -lh zombienet/bin/qustream target/release/qustream 2>/dev/null || true

          echo "Testing binary execution..."
          zombienet/bin/polkadot --version || echo "WARNING: polkadot --version failed"
          zombienet/bin/zombienet --version || echo "WARNING: zombienet --version failed"
          target/release/qustream --version || echo "WARNING: qustream --version failed"

      - name: Start zombienet and wait for network
        timeout-minutes: 90
        run: |
          mkdir -p /tmp/zombienet-logs

          echo "Starting zombienet..."
          make start-zombienet-qustream-ci > /tmp/zombienet-logs/zombienet.log 2>&1 &
          ZOMBIENET_PID=$!
          echo "ZOMBIENET_PID=$ZOMBIENET_PID" >> $GITHUB_ENV

          echo "Waiting for zombienet to start..."
          timeout 3600 bash -c '
          while true; do
            if ! ps -p '"$ZOMBIENET_PID"' > /dev/null 2>&1; then
              echo "ERROR: Zombienet process died during startup"
              echo "Last 100 lines of log:"
              tail -100 /tmp/zombienet-logs/zombienet.log
              exit 1
            fi

            if grep -q "At least one of the nodes fails to start" /tmp/zombienet-logs/zombienet.log 2>/dev/null; then
              echo "ERROR: Node startup failed"
              echo "Last 200 lines of log:"
              tail -200 /tmp/zombienet-logs/zombienet.log
              exit 1
            fi

            if grep -qi "error\|failed\|panic" /tmp/zombienet-logs/zombienet.log 2>/dev/null; then
              ERROR_LINES=$(grep -i "error\|failed\|panic" /tmp/zombienet-logs/zombienet.log | tail -10)
              if [ -n "$ERROR_LINES" ]; then
                echo "WARNING: Errors detected in log:"
                echo "$ERROR_LINES"
              fi
            fi

            if grep -q "Network launched" /tmp/zombienet-logs/zombienet.log 2>/dev/null; then
              echo "✓ Network launched"
              exit 0
            fi

            sleep 10
          done
          ' || {
            echo "=== Full zombienet log ==="
            tail -500 /tmp/zombienet-logs/zombienet.log
            echo ""
            echo "=== Checking for zombie processes ==="
            ps aux | grep -E 'zombienet|polkadot|qustream' || true
            exit 1
          }

          echo "Preflight: probing Prometheus metrics endpoints (alice/bob/collator)..."
          for PORT in 9615 9616 9617; do
            echo " - Checking http://127.0.0.1:${PORT}/metrics"
            if ! timeout 60 bash -c "until curl -sf http://127.0.0.1:${PORT}/metrics > /dev/null; do sleep 5; done"; then
              echo "WARNING: metrics endpoint on ${PORT} not reachable within 60s"
            else
              echo "✓ Metrics reachable on ${PORT}"
            fi
          done

          echo "Waiting for parachain to produce blocks..."
          timeout 600 bash -c '
          RETRIES=0
          while [ $RETRIES -lt 120 ]; do
            BLOCK_HEX=$(curl -s -X POST -H "Content-Type: application/json" --data "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}" http://localhost:8800 2>/dev/null | grep -o "\"result\":\"0x[0-9a-f]*\"" | cut -d"\"" -f4 || echo "")

            if [ -n "$BLOCK_HEX" ]; then
              BLOCK_NUM=$((16#${BLOCK_HEX#0x}))

              if [ $BLOCK_NUM -gt 0 ]; then
                echo "✓ Parachain ready (block $BLOCK_NUM)"
                exit 0
              fi
            fi

            RETRIES=$((RETRIES + 1))
            sleep 5
          done

          echo "ERROR: Parachain timeout"
          exit 1
          ' || {
            tail -200 /tmp/zombienet-logs/zombienet.log
            exit 1
          }

      - name: Deploy QuStream contract
        working-directory: qustream-smart-contracts
        timeout-minutes: 5
        env:
          PRIVATE_KEY: "0x8075991ce870b93a8870eca0c0f91913d12f47948ca0fd25b49c6fa7cdbeee8b"
        run: |
          echo "Deploying QuStream contract to qustreamLocalnet..."

          # Use expect to handle interactive prompts
          expect << 'EOF'
          set timeout 300
          spawn npx hardhat ignition deploy ./ignition/modules/QuStreamRequestManager.ts --network qustreamLocalnet --parameters ./ignition/modules/QuStreamRequestManager.parameters.json --reset

          expect {
            "Confirm deploy to network qustreamLocalnet" {
              send "yes\r"
              exp_continue
            }
            "Confirm reset of deployment" {
              send "yes\r"
              exp_continue
            }
            timeout {
              puts "Deployment timeout"
              exit 1
            }
            eof
          }

          set waitval [wait]
          set exit_code [lindex $waitval 3]
          exit $exit_code
          EOF

          if [ $? -ne 0 ]; then
            echo "Deployment failed"
            ls -la ignition/deployments/chain-*/deployed_addresses.json 2>/dev/null || true
            exit 1
          fi

          echo "✓ Contract deployed"

      - name: Extract deployed contract address
        working-directory: qustream-smart-contracts
        run: |
          echo "Looking for deployed contract address..."
          DEPLOYMENT_DIR=$(find ignition/deployments -name "deployed_addresses.json" -type f | head -1 | xargs dirname 2>/dev/null || echo "")
          if [ -z "$DEPLOYMENT_DIR" ]; then
            echo "ERROR: No deployment directory found"
            echo "Contents of ignition/deployments:"
            ls -la ignition/deployments/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          echo "Found deployment directory: $DEPLOYMENT_DIR"
          DEPLOYMENT_FILE="$DEPLOYMENT_DIR/deployed_addresses.json"
          if [ ! -f "$DEPLOYMENT_FILE" ]; then
            echo "ERROR: deployed_addresses.json not found at $DEPLOYMENT_FILE"
            exit 1
          fi
          echo "Deployment file contents:"
          cat "$DEPLOYMENT_FILE"
          DEPLOYED_ADDRESS=$(cat "$DEPLOYMENT_FILE" | grep -o '"QuStreamRequestManagerModule#QuStreamRequestManager":"0x[^"]*"' | cut -d'"' -f4 || echo "")
          if [ -z "$DEPLOYED_ADDRESS" ]; then
            echo "ERROR: Failed to extract contract address from $DEPLOYMENT_FILE"
            echo "Available keys in file:"
            cat "$DEPLOYMENT_FILE" | grep -o '"[^"]*"' || true
            exit 1
          fi
          echo "Contract deployed at: $DEPLOYED_ADDRESS"
          echo "QUSTREAM_CONTRACT_ADDRESS=$DEPLOYED_ADDRESS" >> $GITHUB_ENV

      - name: Setup indexer environment
        working-directory: qustream-indexer
        run: |
          cp .env.example .env
          sed -i "s|QUSTREAM_CONTRACT_ADDRESS=.*|QUSTREAM_CONTRACT_ADDRESS=$QUSTREAM_CONTRACT_ADDRESS|g" .env
          sed -i "s|CONTRACT_ADDRESS = \".*\"|CONTRACT_ADDRESS = \"$QUSTREAM_CONTRACT_ADDRESS\"|g" test-events.cjs

      - name: Generate database migrations
        working-directory: qustream-indexer
        run: npx sqd migration:generate || true

      - name: Apply database migrations
        working-directory: qustream-indexer
        run: npx sqd migration:apply

      - name: Start indexer processor and API
        working-directory: qustream-indexer
        run: |
          node --require=dotenv/config lib/main.js &
          PROCESSOR_PID=$!
          echo "PROCESSOR_PID=$PROCESSOR_PID" >> $GITHUB_ENV
          node --require=dotenv/config lib/api.js &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV

      - name: Wait for GraphQL API
        timeout-minutes: 3
        run: timeout 120 bash -c 'until curl -s http://localhost:4350/graphql > /dev/null 2>&1; do sleep 5; done'

      - name: Run indexer tests
        working-directory: qustream-indexer
        run: npm test
        timeout-minutes: 5

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Zombienet processes ==="
          ps aux | grep -E 'zombienet|polkadot|qustream' || true
          echo ""
          echo "=== Zombienet logs ==="
          cat /tmp/zombienet-logs/zombienet.log || true
          echo ""
          echo "=== Database logs ==="
          cd qustream-indexer
          docker compose logs db --tail 100 || true

      - name: Cleanup
        if: always()
        run: |
          { [ -n "$ZOMBIENET_PID" ] && kill $ZOMBIENET_PID 2>/dev/null; } || true
          { [ -n "$PROCESSOR_PID" ] && kill $PROCESSOR_PID 2>/dev/null; } || true
          { [ -n "$API_PID" ] && kill $API_PID 2>/dev/null; } || true
          pkill -f zombienet || true
          pkill -f polkadot || true
          pkill -f qustream || true
          cd qustream-indexer && docker compose down || true

      - name: Display sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: indexer-logs
          path: |
            /tmp/zombienet-logs/*.log
            qustream-indexer/*.log
            qustream-indexer/tmp/*.log
