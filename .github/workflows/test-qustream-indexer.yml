name: Test QuStream Indexer

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: "--max-old-space-size=8192 --no-deprecation"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  SCCACHE_CACHE_SIZE: "10GB"
  SCCACHE_GHA_ENABLED: true

jobs:
  test-indexer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PRIVATE_KEY: "0x8075991ce870b93a8870eca0c0f91913d12f47948ca0fd25b49c6fa7cdbeee8b"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "qustream-indexer/.nvmrc"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Rust toolchain
        run: |
          if ! which "rustup" > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          rustup override unset
          rustup target add wasm32-unknown-unknown

      - name: Setup Docker database (background)
        working-directory: qustream-indexer
        run: docker compose up -d db

      - name: Install contract dependencies
        working-directory: qustream-smart-contracts
        run: npm install

      - name: Create contract parameters file
        working-directory: qustream-smart-contracts
        run: |
          cat > ignition/modules/QuStreamRequestManager.parameters.json <<EOF
          {
            "QuStreamRequestManagerModule": {
              "CONTRACT_OWNER": "0xf24FF3a9CF04c71Dbc94D0b566f7A27B94566cac",
              "MASTER_NODE": "0x773539d4Ac0e786233D90A233654ccEE26a613D9"
            }
          }
          EOF

      - name: Install indexer dependencies
        working-directory: qustream-indexer
        run: npm install && npm run build

      - name: Wait for database
        timeout-minutes: 2
        run: timeout 60 bash -c 'until docker exec $(docker ps -qf "name=db") pg_isready -U postgres; do sleep 5; done'

      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Build node binary and setup zombienet
        timeout-minutes: 60
        run: |
          rm -rf zombienet/bin
          mkdir -p zombienet/bin
          make download-binaries
          chmod +x zombienet/bin/* || true
          for bin in zombienet polkadot polkadot-execute-worker polkadot-prepare-worker substrate-relay; do
            test -f "zombienet/bin/$bin" || { echo "Missing $bin"; exit 1; }
            file "zombienet/bin/$bin" | grep -q "ELF" || { echo "Corrupted $bin (expected ELF)"; exit 1; }
          done

          make release-build
          test -f "target/release/qustream" || { echo "Missing target/release/qustream"; exit 1; }

          if [ ! -x "target/release/qustream" ]; then
            chmod +x target/release/qustream
          fi

          if [ ! -e "zombienet/bin/qustream" ]; then
            mkdir -p zombienet/bin
            ln -sf "../../target/release/qustream" zombienet/bin/qustream
          fi

      - name: Start zombienet and wait for network
        timeout-minutes: 90
        run: |
          mkdir -p /tmp/zombienet-logs

          echo "Starting zombienet..."
          make start-zombienet-qustream-ci > /tmp/zombienet-logs/zombienet.log 2>&1 &
          ZOMBIENET_PID=$!
          echo "ZOMBIENET_PID=$ZOMBIENET_PID" >> $GITHUB_ENV

          echo "Waiting for zombienet to start..."
          timeout 3600 bash -c '
          while true; do
            if ! ps -p '"$ZOMBIENET_PID"' > /dev/null 2>&1; then
              echo "ERROR: Zombienet process died during startup"
              echo "Last 100 lines of log:"
              tail -100 /tmp/zombienet-logs/zombienet.log
              exit 1
            fi

            if grep -q "At least one of the nodes fails to start" /tmp/zombienet-logs/zombienet.log 2>/dev/null; then
              echo "ERROR: Node startup failed"
              echo "Last 200 lines of log:"
              tail -200 /tmp/zombienet-logs/zombienet.log
              exit 1
            fi

            if grep -q "Network launched" /tmp/zombienet-logs/zombienet.log 2>/dev/null; then
              echo "✓ Network launched"
              exit 0
            fi

            sleep 10
          done
          ' || {
            echo "=== Full zombienet log ==="
            tail -500 /tmp/zombienet-logs/zombienet.log
            echo ""
            echo "=== Checking for zombie processes ==="
            ps aux | grep -E 'zombienet|polkadot|qustream' || true
            exit 1
          }

          echo "Waiting for parachain to produce blocks..."
          timeout 600 bash -c '
          RETRIES=0
          while [ $RETRIES -lt 120 ]; do
            BLOCK_HEX=$(curl -s -X POST -H "Content-Type: application/json" --data "{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}" http://localhost:8800 2>/dev/null | grep -o "\"result\":\"0x[0-9a-f]*\"" | cut -d"\"" -f4 || echo "")

            if [ -n "$BLOCK_HEX" ]; then
              BLOCK_NUM=$((16#${BLOCK_HEX#0x}))

              if [ $BLOCK_NUM -gt 0 ]; then
                echo "✓ Parachain ready (block $BLOCK_NUM)"
                exit 0
              fi
            fi

            RETRIES=$((RETRIES + 1))
            sleep 5
          done

          echo "ERROR: Parachain timeout"
          exit 1
          ' || {
            tail -200 /tmp/zombienet-logs/zombienet.log
            exit 1
          }

      - name: Deploy QuStream contract
        working-directory: qustream-smart-contracts
        timeout-minutes: 5
        run: |
          echo "Deploying QuStream contract to qustreamLocalnet..."

          # Use expect to handle interactive prompts
          expect << 'EOF'
          set timeout 300
          spawn npx hardhat ignition deploy ./ignition/modules/QuStreamRequestManager.ts --network qustreamLocalnet --parameters ./ignition/modules/QuStreamRequestManager.parameters.json --reset

          expect {
            "Confirm deploy to network qustreamLocalnet" {
              send "yes\r"
              exp_continue
            }
            "Confirm reset of deployment" {
              send "yes\r"
              exp_continue
            }
            timeout {
              puts "Deployment timeout"
              exit 1
            }
            eof
          }

          set waitval [wait]
          set exit_code [lindex $waitval 3]
          exit $exit_code
          EOF

          if [ $? -ne 0 ]; then
            echo "Deployment failed"
            ls -la ignition/deployments/chain-*/deployed_addresses.json 2>/dev/null || true
            exit 1
          fi

          echo "✓ Contract deployed"

      - name: Extract deployed contract address
        working-directory: qustream-smart-contracts
        run: |
          echo "Looking for deployed contract address..."
          DEPLOYMENT_DIR=$(find ignition/deployments -name "deployed_addresses.json" -type f | head -1 | xargs dirname 2>/dev/null || echo "")
          if [ -z "$DEPLOYMENT_DIR" ]; then
            echo "ERROR: No deployment directory found"
            echo "Contents of ignition/deployments:"
            ls -la ignition/deployments/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
          echo "Found deployment directory: $DEPLOYMENT_DIR"
          DEPLOYMENT_FILE="$DEPLOYMENT_DIR/deployed_addresses.json"
          if [ ! -f "$DEPLOYMENT_FILE" ]; then
            echo "ERROR: deployed_addresses.json not found at $DEPLOYMENT_FILE"
            exit 1
          fi
          echo "Deployment file contents:"
          cat "$DEPLOYMENT_FILE"
          DEPLOYED_ADDRESS=$(node -e 'const fs=require("fs"); const key="QuStreamRequestManagerModule#QuStreamRequestManager"; const file=process.argv[1]; const json=JSON.parse(fs.readFileSync(file,"utf8")); process.stdout.write((json[key] ?? ""));' "$DEPLOYMENT_FILE" 2>/dev/null || echo "")
          if [ -z "$DEPLOYED_ADDRESS" ]; then
            echo "ERROR: Failed to extract contract address from $DEPLOYMENT_FILE"
            echo "Available keys in file:"
            cat "$DEPLOYMENT_FILE" | grep -o '"[^"]*"' || true
            exit 1
          fi
          echo "Contract deployed at: $DEPLOYED_ADDRESS"
          echo "QUSTREAM_CONTRACT_ADDRESS=$DEPLOYED_ADDRESS" >> $GITHUB_ENV

      - name: Setup indexer environment
        working-directory: qustream-indexer
        run: |
          cp .env.example .env
          sed -i "s|QUSTREAM_CONTRACT_ADDRESS=.*|QUSTREAM_CONTRACT_ADDRESS=$QUSTREAM_CONTRACT_ADDRESS|g" .env
          sed -i "s|CONTRACT_ADDRESS = \".*\"|CONTRACT_ADDRESS = \"$QUSTREAM_CONTRACT_ADDRESS\"|g" test-events.cjs

      - name: Generate database migrations
        working-directory: qustream-indexer
        run: npx --yes @subsquid/cli migration:generate || true

      - name: Apply database migrations
        working-directory: qustream-indexer
        run: npx --yes @subsquid/cli migration:apply

      - name: Start indexer processor and API
        working-directory: qustream-indexer
        run: |
          node --require=dotenv/config lib/main.js &
          PROCESSOR_PID=$!
          echo "PROCESSOR_PID=$PROCESSOR_PID" >> $GITHUB_ENV
          node --require=dotenv/config lib/api.js &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV

      - name: Wait for GraphQL API
        timeout-minutes: 3
        run: timeout 120 bash -c 'until curl -s http://localhost:4350/graphql > /dev/null 2>&1; do sleep 5; done'

      - name: Run indexer tests
        working-directory: qustream-indexer
        run: npm test
        timeout-minutes: 5

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Zombienet logs ==="
          tail -500 /tmp/zombienet-logs/zombienet.log || true

      - name: Cleanup
        if: always()
        run: |
          { [ -n "$ZOMBIENET_PID" ] && kill $ZOMBIENET_PID 2>/dev/null; } || true
          { [ -n "$PROCESSOR_PID" ] && kill $PROCESSOR_PID 2>/dev/null; } || true
          { [ -n "$API_PID" ] && kill $API_PID 2>/dev/null; } || true
          pkill -f zombienet || true
          pkill -f polkadot || true
          pkill -f qustream || true
          cd qustream-indexer && docker compose down || true

      - name: Display sccache stats
        if: always()
        run: ${SCCACHE_PATH} --show-stats || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: indexer-logs
          path: |
            /tmp/zombienet-logs/*.log
            qustream-indexer/*.log
            qustream-indexer/tmp/*.log
